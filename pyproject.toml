[project]
name = "genai-practice"
version = "0.1.0"
description = "GenAI in Practice workshop materials"
requires-python = ">=3.12"
dependencies = [
    "langchain-anthropic>=1.7.3",
    "langchain-huggingface[full]>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.12",
    "pypdf>=6.18.1",
    "python-dotenv>=1.2.3",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[dependency-groups]
dev = [
    "nbformat>=5.11.1",
    "prek>=0.5.3",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.uv]
default-groups = []

[tool.ty.src]
exclude = ["notebooks/*.ipynb"]

[tool.ruff]
line-length = 120
fix = true
lint.select = ["E", "F", "I"]
lint.exclude = ["notebooks/*.ipynb"]
