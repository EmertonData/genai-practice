[project]
name = "genai-practice"
version = "0.1.0"
description = "GenAI in Practice workshop materials"
requires-python = ">=3.12"
dependencies = [
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
