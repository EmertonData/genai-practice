<svg width="620" height="262" viewBox="0 0 620 262" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="620" height="262" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14203a"/>
    </marker>
  </defs>

  <!-- START -->
  <rect x="22" y="94" width="66" height="30" rx="15" fill="#000000" opacity="0.07"/>
  <text x="55" y="114" font-family="monospace" font-size="12" fill="#14203a"
        text-anchor="middle">START</text>

  <!-- the model node -->
  <rect x="140" y="86" width="192" height="46" rx="5" fill="#5b9bd5" opacity="0.45"/>
  <rect x="140" y="86" width="192" height="46" rx="5" fill="none" stroke="#3d7ebf" stroke-width="2"/>
  <text x="236" y="107" font-family="monospace" font-size="12.5" fill="#14203a"
        text-anchor="middle">answer_or_call_tool</text>
  <text x="236" y="123" font-family="sans-serif" font-size="11" fill="#3d7ebf"
        text-anchor="middle">the model decides</text>

  <!-- the tools node -->
  <rect x="428" y="86" width="140" height="46" rx="5" fill="#ffd966" opacity="0.55"/>
  <rect x="428" y="86" width="140" height="46" rx="5" fill="none" stroke="#bf9000" stroke-width="2"/>
  <text x="498" y="107" font-family="monospace" font-size="12.5" fill="#14203a"
        text-anchor="middle">tools</text>
  <text x="498" y="123" font-family="sans-serif" font-size="11" fill="#bf9000"
        text-anchor="middle">the search runs</text>

  <!-- END -->
  <rect x="203" y="186" width="66" height="30" rx="15" fill="#a284d8" opacity="0.45"/>
  <text x="236" y="206" font-family="monospace" font-size="12" fill="#14203a"
        text-anchor="middle">END</text>

  <!-- START -> model -->
  <line x1="90" y1="109" x2="134" y2="109" stroke="#14203a" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- model -> tools, the conditional edge -->
  <path d="M 332 99 L 422 99" stroke="#bf9000" stroke-width="2.5"
        stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
  <text x="377" y="90" font-family="sans-serif" font-size="11" fill="#bf9000"
        text-anchor="middle">asked for a tool</text>

  <!-- tools -> model, the edge that closes the loop -->
  <path d="M 428 119 L 338 119" stroke="#3d7ebf" stroke-width="2.5" fill="none"
        marker-end="url(#arrow)"/>
  <text x="383" y="136" font-family="sans-serif" font-size="11" fill="#3d7ebf"
        text-anchor="middle">always back</text>

  <!-- model -> END, the other branch of the conditional edge -->
  <path d="M 236 132 L 236 180" stroke="#8a63c9" stroke-width="2.5"
        stroke-dasharray="6 4" fill="none" marker-end="url(#arrow)"/>
  <text x="248" y="160" font-family="sans-serif" font-size="11" fill="#8a63c9">answered, no tool</text>

  <!-- legend -->
  <line x1="22" y1="234" x2="52" y2="234" stroke="#14203a" stroke-width="2.5"/>
  <text x="58" y="238" font-family="sans-serif" font-size="10.5" fill="#14203a">edge: always taken</text>

  <line x1="22" y1="252" x2="52" y2="252" stroke="#14203a" stroke-width="2.5"
        stroke-dasharray="6 4"/>
  <text x="58" y="256" font-family="sans-serif" font-size="10.5" fill="#14203a">conditional edge: the router picks one</text>
</svg>
